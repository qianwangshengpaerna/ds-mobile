name: Import ds mobile release files
on:
  push:
    branches: [main]
    paths: ['.upload/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify binary files
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          manifest=json.loads(pathlib.Path('.upload/manifest.json').read_text())
          allowed={'upstream/public/document-font.otf','downloads/ds-mobile-v0.2.0.apk'}
          for item in manifest['artifacts']:
              if item['path'] not in allowed:
                  raise SystemExit('Unexpected artifact path')
              target=pathlib.Path(item['path'])
              target.parent.mkdir(parents=True,exist_ok=True)
              with target.open('wb') as output:
                  for name in item['parts']:
                      part=pathlib.Path(name)
                      if part.is_absolute() or '..' in part.parts or part.parts[0]!='.upload':
                          raise SystemExit('Invalid upload part')
                      with part.open('rb') as source:
                          shutil.copyfileobj(source,output)
              if target.stat().st_size!=item['bytes'] or hashlib.sha256(target.read_bytes()).hexdigest()!=item['sha256']:
                  raise SystemExit('Artifact verification failed: '+str(target))
              print('Verified',target,item['sha256'])
          PY
      - name: Commit restored source and APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream/public/document-font.otf downloads/ds-mobile-v0.2.0.apk
          git rm -r .upload
          git commit -m 'Restore verified source assets and APK v0.2.0'
          git push origin HEAD:main
      - name: Publish v0.2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/ds-mobile-release-notes.md" <<'NOTES'
          ds mobile v0.2.0

          - DeepSeek / Gemini model selection
          - DeepSeek history ZIP import and project spaces
          - Word, Excel and Chinese PDF document tools
          - Android export folder selection and input cache metrics

          Android 8.0+. Development-signed APK. Includes simulated framework, browser and document-format checks; real-device and live-key validation remain pending.
          NOTES
          gh release create v0.2.0 downloads/ds-mobile-v0.2.0.apk downloads/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title 'ds mobile v0.2.0' --notes-file "$RUNNER_TEMP/ds-mobile-release-notes.md"
